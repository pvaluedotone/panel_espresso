# Google Cloud Build configuration for Panel Espresso
# This file automates the build and deployment process

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/panel-espresso:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/panel-espresso:latest'
      - '.'
    timeout: 900s

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/panel-espresso:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/panel-espresso:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'panel-espresso'
      - '--image'
      - 'gcr.io/$PROJECT_ID/panel-espresso:$COMMIT_SHA'
      - '--region'
      - 'us-central1'  # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Change to --no-allow-unauthenticated for private access
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'  # Scale to zero when not in use
      - '--port'
      - '8080'

# Image will be pushed to Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/panel-espresso:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/panel-espresso:latest'

# Build timeout
timeout: 1200s

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
